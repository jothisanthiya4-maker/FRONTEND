// frequency of letters

let string ="madam"
let counted = ""

for(let i=0;i<string.length;i++){
    
    let alreadyexist=false

    for(let j=0;j<counted.length;j++){

        if(string[i]==counted[j]){
            alreadyexist=true
        }
    }

    if(!alreadyexist){
        let count=0

        for(let j=0;j<string.length;j++){
            if(string[i]==string[j]){
                count++
            }
        }
        console.log(string[i], ":",count );
        counted+=string[i]
    }
}
 

// duplicate array element

let arr4 = [2, 3, 4, 1, 2, 3];
let result = [];

for (let i = 0; i < arr4.length; i++) {

    let duplicate = false;

    for (let j = 0; j < result.length; j++) {

        if (arr4[i] == result[j]) {
            duplicate = true;
        }
    }

    if (!duplicate) {
        result[result.length] = arr4[i];
    }
}

console.log(result);

// first non repeating character 

let words="swiss"

   let  repeat=false

        }
    }

    if(!repeat){

    }
}

// most repeated element in array 

let arrr = [1, 2, 3, 2, 4, 2, 3];

let mostnum=arr[0]
let max=0

for(let i=0;i<arrr.length;i++){
    let count=0
    for(let j=0;j<arrr.length;j++){
        if(arrr[i]==arrr[j]){
            count++
        }
    }
    if(count>max){

        max=count
    }
}
